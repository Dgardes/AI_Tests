behaviors:
  MyAI:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3 #увеличивает случайность, чтобы боты чаще пробовали обходить
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      memory: #память 
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity: #любопытство для исследования карты
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
    max_steps: 2000000
    summary_freq: 10000

engine_settings:
  no_graphics: false
  time_scale: 1.0